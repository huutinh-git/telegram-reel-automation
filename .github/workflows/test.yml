name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste TikTok / Facebook / Douyin URL"
        required: true
        type: string

  repository_dispatch:
    types:
      - telegram-video

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve video URL
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_URL: ${{ inputs.video_url }}
          DISPATCH_URL: ${{ github.event.client_payload.video_url }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            VIDEO_URL="$DISPATCH_URL"
          else
            VIDEO_URL="$MANUAL_URL"
          fi

          if [ -z "$VIDEO_URL" ]; then
            echo "ERROR: No video URL received"
            exit 1
          fi

          echo "VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"
          echo "Video URL received successfully"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"

          echo "yt-dlp version:"
          yt-dlp --version

      - name: Download video
        run: |
          mkdir -p downloads

          echo "Starting video download..."

          yt-dlp \
            --no-simulate \
            --no-playlist \
            --newline \
            --merge-output-format mp4 \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

          echo ""
          echo "Downloaded files:"
          ls -lah downloads

      - name: Inspect downloaded video
        run: |
          VIDEO_FILE=$(find downloads -type f -name "*.mp4" | head -n 1)

          if [ -z "$VIDEO_FILE" ]; then
            echo "ERROR: No MP4 file found"
            echo "Files actually created:"
            find downloads -type f -print
            exit 1
          fi

          echo "Video file: $VIDEO_FILE"
          echo ""

          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$VIDEO_FILE"

      - name: Send video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VIDEO_FILE=$(find downloads -type f -name "*.mp4" | head -n 1)

          if [ -z "$VIDEO_FILE" ]; then
            echo "ERROR: No MP4 file found"
            exit 1
          fi

          echo "Sending video to Telegram..."

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${VIDEO_FILE}" \
            -F "supports_streaming=true" \
            -F "caption=Video downloaded successfully."

      - name: Upload downloaded video
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-video
          path: downloads/
          if-no-files-found: error
          retention-days: 1
