name: Test Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste TikTok / Facebook / Douyin URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Python
        run: python --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install latest yt-dlp nightly
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          yt-dlp --version

          echo "Available impersonation targets:"
          yt-dlp --list-impersonate-targets

      - name: Download video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p downloads

          echo "================================"
          echo "Starting video download"
          echo "================================"

          yt-dlp \
            --no-simulate \
            --no-playlist \
            --newline \
            --merge-output-format mp4 \
            --print "Extractor: %(extractor)s" \
            --print "Video ID: %(id)s" \
            --print "Title: %(title)s" \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

          echo ""
          echo "================================"
          echo "Downloaded files"
          echo "================================"

          ls -lah downloads

      - name: Inspect downloaded video
        run: |
          VIDEO_FILE=$(find downloads -type f -name "*.mp4" | head -n 1)

          if [ -z "$VIDEO_FILE" ]; then
            echo "No MP4 file found"
            echo "Files actually created:"
            find downloads -type f -maxdepth 2 -print
            exit 1
          fi

          echo "Video file: $VIDEO_FILE"

          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$VIDEO_FILE"

      - name: Upload downloaded video
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
          if-no-files-found: error
          retention-days: 1
