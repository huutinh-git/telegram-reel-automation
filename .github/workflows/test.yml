export default {
  async fetch(request, env) {
    const url = new URL(request.url);

    // =========================================
    // 1. Health check
    // =========================================
    if (request.method === "GET" && url.pathname === "/") {
      return Response.json({
        ok: true,
        service: "telegram-reel-bot",
      });
    }

    // =========================================
    // 2. Telegram webhook
    // =========================================
    if (request.method === "POST" && url.pathname === "/telegram") {
      try {
        const update = await request.json();

        // Không phải message text thì bỏ qua
        if (!update.message || !update.message.text) {
          return Response.json({ ok: true });
        }

        const chatId = update.message.chat.id;
        const userId = update.message.from?.id;
        const text = update.message.text.trim();

        // Chỉ cho Telegram account của bạn sử dụng bot
        if (
          String(userId) !== String(env.TELEGRAM_ALLOWED_USER_ID)
        ) {
          await sendTelegramMessage(
            env.TELEGRAM_BOT_TOKEN,
            chatId,
            "Bạn không có quyền sử dụng bot này."
          );

          return Response.json({ ok: true });
        }

        // Tìm URL đầu tiên trong message
        const urlMatch = text.match(/https?:\/\/[^\s]+/i);

        if (!urlMatch) {
          await sendTelegramMessage(
            env.TELEGRAM_BOT_TOKEN,
            chatId,
            "Không tìm thấy link video. Hãy gửi một link TikTok, Facebook hoặc Douyin."
          );

          return Response.json({ ok: true });
        }

        const videoUrl = cleanUrl(urlMatch[0]);

        await sendTelegramMessage(
          env.TELEGRAM_BOT_TOKEN,
          chatId,
          "Đã nhận link. Đang gửi video sang hệ thống xử lý..."
        );

        // Gọi GitHub
        const githubResponse = await dispatchToGitHub(
          env.GITHUB_TOKEN,
          videoUrl
        );

        if (!githubResponse.ok) {
          console.error(
            "GitHub dispatch error:",
            githubResponse.status,
            await githubResponse.text()
          );

          await sendTelegramMessage(
            env.TELEGRAM_BOT_TOKEN,
            chatId,
            `Không thể kích hoạt GitHub Actions. HTTP ${githubResponse.status}`
          );

          return Response.json({ ok: true });
        }

        await sendTelegramMessage(
          env.TELEGRAM_BOT_TOKEN,
          chatId,
          "GitHub Actions đã được kích hoạt. Video đang được tải."
        );

        return Response.json({ ok: true });
      } catch (error) {
        console.error("Telegram webhook error:", error);

        return Response.json(
          {
            ok: false,
            error: "Internal server error",
          },
          { status: 500 }
        );
      }
    }

    // =========================================
    // 3. Manual dispatch endpoint
    //    Giữ lại để debug sau này
    // =========================================
    if (request.method === "POST" && url.pathname === "/dispatch") {
      try {
        const body = await request.json();

        if (!body.video_url) {
          return Response.json(
            {
              ok: false,
              error: "video_url is required",
            },
            { status: 400 }
          );
        }

        const githubResponse = await dispatchToGitHub(
          env.GITHUB_TOKEN,
          body.video_url
        );

        if (!githubResponse.ok) {
          return Response.json(
            {
              ok: false,
              error: "GitHub dispatch failed",
              status: githubResponse.status,
            },
            { status: 502 }
          );
        }

        return Response.json({
          ok: true,
          message: "Video sent to GitHub Actions",
        });
      } catch (error) {
        console.error(error);

        return Response.json(
          {
            ok: false,
            error: "Internal server error",
          },
          { status: 500 }
        );
      }
    }

    return new Response("Not Found", {
      status: 404,
    });
  },
};


// =============================================
// GitHub repository_dispatch
// =============================================

async function dispatchToGitHub(githubToken, videoUrl) {
  return fetch(
    "https://api.github.com/repos/huutinh-git/telegram-reel-automation/dispatches",
    {
      method: "POST",

      headers: {
        Accept: "application/vnd.github+json",
        Authorization: `Bearer ${githubToken}`,
        "X-GitHub-Api-Version": "2026-03-10",
        "User-Agent": "telegram-reel-cloudflare-worker",
        "Content-Type": "application/json",
      },

      body: JSON.stringify({
        event_type: "telegram-video",

        client_payload: {
          video_url: videoUrl,
        },
      }),
    }
  );
}


// =============================================
// Telegram sendMessage
// =============================================

async function sendTelegramMessage(botToken, chatId, text) {
  return fetch(
    `https://api.telegram.org/bot${botToken}/sendMessage`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
      },

      body: JSON.stringify({
        chat_id: chatId,
        text: text,
      }),
    }
  );
}


// =============================================
// Clean URL
// =============================================

function cleanUrl(url) {
  return url
    .replace(/[)\]}>.,!?]+$/g, "")
    .trim();
}
