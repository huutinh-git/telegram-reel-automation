name: Telegram to Facebook Reel

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste source video URL"
        required: true
        type: string

      dry_run:
        description: "Process locally and create an artifact; DO NOT publish to Facebook"
        required: false
        type: boolean
        default: false

      caption:
        description: "Optional Facebook Reel caption"
        required: false
        type: string

  repository_dispatch:
    types:
      - telegram-video

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. Checkout
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # =====================================================
      # 2. Resolve request
      # =====================================================
      - name: Resolve request data
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_URL: ${{ inputs.video_url }}
          MANUAL_CAPTION: ${{ inputs.caption }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_URL: ${{ github.event.client_payload.video_url }}
          DISPATCH_CAPTION: ${{ github.event.client_payload.caption }}
          DISPATCH_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DISPATCH_STATUS_MESSAGE_ID: ${{ github.event.client_payload.status_message_id }}
          FALLBACK_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_SOURCE_HOSTS: ${{ vars.ALLOWED_SOURCE_HOSTS }}
        run: python3 scripts/prepare_request.py

      # =====================================================
      # 3. Dependencies
      # =====================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp[default,curl-cffi]==2026.10.26"

          echo "yt-dlp:"
          yt-dlp --version

      # =====================================================
      # 4. Status - downloading
      # =====================================================
      - name: Status - Downloading
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=⬇️ Đang tải video..." \
              > /dev/null || true
          fi

      # =====================================================
      # 5. Download source
      # =====================================================
      - name: Download source video
        run: |
          mkdir -p downloads

          yt-dlp \
            --no-simulate \
            --no-playlist \
            --newline \
            --merge-output-format mp4 \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

          echo "Downloaded files:"
          ls -lah downloads

      # =====================================================
      # 6. Inspect source
      # =====================================================
      - name: Inspect source video
        run: |
          SOURCE_FILE=$(find downloads -type f -name "*.mp4" | head -n 1)

          if [ -z "$SOURCE_FILE" ]; then
            echo "ERROR: No MP4 file found"
            find downloads -type f -print
            exit 1
          fi

          echo "SOURCE_FILE=$SOURCE_FILE" >> "$GITHUB_ENV"

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$SOURCE_FILE")

          echo "Duration: $DURATION seconds"

          python - <<PY
          duration = float("$DURATION")

          if duration < 4:
              raise SystemExit(
                  "ERROR: Facebook Reel must be at least 4 seconds"
              )
          PY

          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$SOURCE_FILE"

      # =====================================================
      # 7. Status - normalizing
      # =====================================================
      - name: Status - Normalizing
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=🎞️ Đang chuẩn hóa video cho Facebook..." \
              > /dev/null || true
          fi

      # =====================================================
      # 8. Normalize Reel
      # =====================================================
      - name: Normalize video
        run: |
          mkdir -p processed

          ffmpeg \
            -y \
            -i "$SOURCE_FILE" \
            -map 0:v:0 \
            -map 0:a:0? \
            -t 60 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,fps=30,setsar=1" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -profile:v high \
            -level 4.1 \
            -c:a aac \
            -b:a 128k \
            -ar 48000 \
            -movflags +faststart \
            processed/ready.mp4

          if [ ! -f processed/ready.mp4 ]; then
            echo "ERROR: processed/ready.mp4 not created"
            exit 1
          fi

      # =====================================================
      # 9. Verify processed video
      # =====================================================
      - name: Verify processed video
        run: |
          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of default=noprint_wrappers=1:nokey=1 \
            processed/ready.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of default=noprint_wrappers=1:nokey=1 \
            processed/ready.mp4)

          VIDEO_CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            processed/ready.mp4)

          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "Codec: $VIDEO_CODEC"

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERROR: Invalid final resolution"
            exit 1
          fi

          if [ "$VIDEO_CODEC" != "h264" ]; then
            echo "ERROR: Invalid video codec"
            exit 1
          fi

          echo "Facebook-ready video verified"

      - name: Dry-run summary (no Facebook or Telegram requests)
        if: ${{ steps.request.outputs.dry_run == 'true' }}
        run: |
          echo "Video validated and transcoded. All Facebook and Telegram API steps were skipped." >> "$GITHUB_STEP_SUMMARY"

      # =====================================================
      # 10. Status - Facebook upload
      # =====================================================
      - name: Status - Uploading Facebook
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=📘 Đang tải Reel lên Facebook..." \
              > /dev/null || true
          fi

      # =====================================================
      # 11. Create Facebook Reel session
      # =====================================================
      - name: Create Facebook Reel session
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

        run: |
          START_RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://graph.facebook.com/v26.0/me/video_reels" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            --data-urlencode "upload_phase=start")

          VIDEO_ID=$(echo "$START_RESPONSE" | python -c \
            "import sys,json; print(json.load(sys.stdin).get('video_id',''))")

          UPLOAD_URL=$(echo "$START_RESPONSE" | python -c \
            "import sys,json; print(json.load(sys.stdin).get('upload_url',''))")

          if [ -z "$VIDEO_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: Facebook did not return upload session"
            echo "Facebook did not provide a usable upload session (details withheld)"
            exit 1
          fi

          echo "::add-mask::$UPLOAD_URL"
          echo "FACEBOOK_VIDEO_ID=$VIDEO_ID" >> "$GITHUB_ENV"
          echo "FACEBOOK_UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"

          echo "Facebook Video ID: $VIDEO_ID"

      # =====================================================
      # 12. Upload binary to Facebook
      # =====================================================
      - name: Upload video to Facebook
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

        run: |
          FILE_SIZE=$(stat -c%s processed/ready.mp4)

          echo "Uploading $FILE_SIZE bytes..."

          UPLOAD_RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "$FACEBOOK_UPLOAD_URL" \
            -H "Authorization: OAuth ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            -H "offset: 0" \
            -H "file_size: ${FILE_SIZE}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@processed/ready.mp4")

          UPLOAD_SUCCESS=$(echo "$UPLOAD_RESPONSE" | python -c \
            "import sys,json; print(str(json.load(sys.stdin).get('success',False)).lower())")

          if [ "$UPLOAD_SUCCESS" != "true" ]; then
            echo "ERROR: Facebook video upload failed"
            echo "Facebook rejected the upload (response withheld)"
            exit 1
          fi

          echo "Facebook upload complete"

      # =====================================================
      # 13. Status - publishing
      # =====================================================
      - name: Status - Publishing
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=🚀 Video đã tải xong. Đang xuất bản Reel..." \
              > /dev/null || true
          fi

      # =====================================================
      # 14. Publish PUBLIC Reel + caption
      # =====================================================
      - name: Publish Facebook Reel
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

        run: |
          CURL_ARGS=(
            -X POST
            "https://graph.facebook.com/v26.0/me/video_reels"
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}"
            --data-urlencode "video_id=${FACEBOOK_VIDEO_ID}"
            --data-urlencode "upload_phase=finish"
            --data-urlencode "video_state=PUBLISHED"
          )

          if [ -n "$CAPTION" ]; then
            CURL_ARGS+=(
              --data-urlencode "description=${CAPTION}"
            )
          fi

          PUBLISH_RESPONSE=$(curl \
            --fail-with-body \
            -sS \
            "${CURL_ARGS[@]}")

          echo "Facebook publish request completed; checking status"

          PUBLISH_SUCCESS=$(echo "$PUBLISH_RESPONSE" | python -c \
            "import sys,json; print(str(json.load(sys.stdin).get('success',False)).lower())")

          if [ "$PUBLISH_SUCCESS" != "true" ]; then
            echo "ERROR: Facebook rejected Reel publish"
            exit 1
          fi

          echo "Facebook accepted PUBLISHED request"

      # =====================================================
      # 15. Status - Facebook processing
      # =====================================================
      - name: Status - Facebook processing
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=⏳ Facebook đang xử lý và xuất bản Reel..." \
              > /dev/null || true
          fi

      # =====================================================
      # 16. Wait until publishing completes
      # =====================================================
      - name: Wait for Facebook publishing
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

        run: |
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          FACEBOOK_DONE=false

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "Facebook status check ${ATTEMPT}/${MAX_ATTEMPTS}"

            STATUS_RESPONSE=$(curl \
              --fail-with-body \
              -sS \
              -G \
              "https://graph.facebook.com/v26.0/${FACEBOOK_VIDEO_ID}" \
              --data-urlencode "fields=status" \
              --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}")

            VIDEO_STATUS=$(echo "$STATUS_RESPONSE" | python -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status',{}).get('video_status',''))")

            PROCESSING_STATUS=$(echo "$STATUS_RESPONSE" | python -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status',{}).get('processing_phase',{}).get('status',''))")

            PUBLISHING_STATUS=$(echo "$STATUS_RESPONSE" | python -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status',{}).get('publishing_phase',{}).get('status',''))")

            echo "video_status=$VIDEO_STATUS"
            echo "processing=$PROCESSING_STATUS"
            echo "publishing=$PUBLISHING_STATUS"

            if [ "$VIDEO_STATUS" = "error" ] || \
               [ "$PROCESSING_STATUS" = "error" ] || \
               [ "$PUBLISHING_STATUS" = "error" ]; then

              echo "Facebook processing error:"
              echo "$STATUS_RESPONSE" | python -m json.tool || true

              exit 1
            fi

            if [ "$PUBLISHING_STATUS" = "complete" ]; then
              FACEBOOK_DONE=true
              break
            fi

            sleep "$SLEEP_SECONDS"
          done

          if [ "$FACEBOOK_DONE" != "true" ]; then
            echo "ERROR: Timed out waiting for Facebook publishing"
            exit 1
          fi

          echo "Facebook publishing confirmed"

      # =====================================================
      # 17. Try to get permalink
      # =====================================================
      - name: Get Facebook Reel link
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

        run: |
          DETAILS=$(curl \
            -sS \
            -G \
            "https://graph.facebook.com/v26.0/${FACEBOOK_VIDEO_ID}" \
            --data-urlencode "fields=permalink_url" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            || true)

          PERMALINK=$(echo "$DETAILS" | python -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('permalink_url',''))" \
            2>/dev/null || true)

          LINK_DELIMITER=$(python -c "import uuid; print('LINK_' + uuid.uuid4().hex)")

          {
            echo "FACEBOOK_PERMALINK<<$LINK_DELIMITER"
            printf '%s\n' "$PERMALINK"
            echo "$LINK_DELIMITER"
          } >> "$GITHUB_ENV"

      # =====================================================
      # 18. Telegram final confirmation
      # =====================================================
      - name: Status - Published successfully
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          FINAL_TEXT="✅ Reel đã được đăng thành công lên Facebook Page Reels For You."

          if [ -n "$FACEBOOK_PERMALINK" ]; then
            FINAL_TEXT="${FINAL_TEXT}

          🔗 ${FACEBOOK_PERMALINK}"
          fi

          # Update existing status message
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=${FINAL_TEXT}" \
              --data-urlencode "disable_web_page_preview=true" \
              > /dev/null || true
          fi

          # Also send a fresh confirmation
          if [ -n "$CHAT_ID" ]; then
            curl --fail-with-body -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${FINAL_TEXT}" \
              --data-urlencode "disable_web_page_preview=true"
          fi

      # =====================================================
      # 19. Return processed video to Telegram
      # =====================================================
      - name: Send processed video to Telegram
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          if [ -z "$CHAT_ID" ]; then
            exit 0
          fi

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${CHAT_ID}" \
            -F "video=@processed/ready.mp4" \
            -F "supports_streaming=true"

      # =====================================================
      # 20. Artifact
      # =====================================================
      - name: Upload processed artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7

        with:
          name: processed-facebook-reel
          path: processed/ready.mp4
          if-no-files-found: error
          retention-days: 1

      # =====================================================
      # 21. Failure notification
      # =====================================================
      - name: Status - Failed
        if: ${{ failure() && steps.request.outputs.dry_run != 'true' }}
        continue-on-error: true

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          ERROR_TEXT="❌ Không đăng được Reel. Kiểm tra GitHub Actions để xem bước bị lỗi."

          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=${ERROR_TEXT}" \
              > /dev/null || true
          fi

          if [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${ERROR_TEXT}" \
              > /dev/null || true
          fi
