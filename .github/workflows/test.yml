name: Test Video Downloader

on:
  # Cho phép chạy thủ công trên GitHub
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste TikTok / Facebook / Douyin URL"
        required: true
        type: string

  # Cho phép Telegram / Cloudflare / API kích hoạt workflow
  repository_dispatch:
    types: [telegram-video]

# GITHUB_TOKEN bên trong workflow chỉ cần quyền đọc repo
permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================
      # 2. Check Python
      # =========================
      - name: Check Python
        run: python --version

      # =========================
      # 3. Install FFmpeg
      # =========================
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

      # =========================
      # 4. Install yt-dlp
      # =========================
      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"

          echo "yt-dlp version:"
          yt-dlp --version

          echo ""
          echo "Available impersonation targets:"
          yt-dlp --list-impersonate-targets || true

      # =========================
      # 5. Resolve input URL
      # =========================
      - name: Resolve video URL
        id: resolve_url
        env:
          DISPATCH_URL: ${{ github.event.client_payload.video_url }}
          MANUAL_URL: ${{ inputs.video_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            VIDEO_URL="$DISPATCH_URL"
          else
            VIDEO_URL="$MANUAL_URL"
          fi

          if [ -z "$VIDEO_URL" ]; then
            echo "ERROR: No video URL received."
            exit 1
          fi

          echo "Video URL received successfully."

          # Lưu URL để các step sau sử dụng.
          # Không echo URL ra log để hạn chế lộ query parameter không cần thiết.
          echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"

      # =========================
      # 6. Download video
      # =========================
      - name: Download video
        env:
          VIDEO_URL: ${{ steps.resolve_url.outputs.video_url }}
        run: |
          mkdir -p downloads

          echo "================================"
          echo "Starting video download"
          echo "================================"

          yt-dlp \
            --no-simulate \
            --no-playlist \
            --newline \
            --merge-output-format mp4 \
            --print "Extractor: %(extractor)s" \
            --print "Video ID: %(id)s" \
            --print "Title: %(title)s" \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

          echo ""
          echo "================================"
          echo "Downloaded files"
          echo "================================"

          ls -lah downloads

      # =========================
      # 7. Validate downloaded file
      # =========================
      - name: Inspect downloaded video
        run: |
          VIDEO_FILE=$(find downloads -type f -name "*.mp4" | head -n 1)

          if [ -z "$VIDEO_FILE" ]; then
            echo "ERROR: No MP4 file found."
            echo ""
            echo "Files actually created:"
            find downloads -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Video file: $VIDEO_FILE"
          echo ""

          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$VIDEO_FILE"

      # =========================
      # 8. Upload test artifact
      # =========================
      - name: Upload downloaded video
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-video
          path: downloads/
          if-no-files-found: error
          retention-days: 1
