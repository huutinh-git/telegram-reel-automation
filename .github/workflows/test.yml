name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste TikTok / Facebook / Douyin URL"
        required: true
        type: string

  repository_dispatch:
    types:
      - telegram-video

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve request data
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_URL: ${{ inputs.video_url }}
          DISPATCH_URL: ${{ github.event.client_payload.video_url }}
          DISPATCH_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DISPATCH_STATUS_MESSAGE_ID: ${{ github.event.client_payload.status_message_id }}
          FALLBACK_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            VIDEO_URL="$DISPATCH_URL"
            CHAT_ID="$DISPATCH_CHAT_ID"
            STATUS_MESSAGE_ID="$DISPATCH_STATUS_MESSAGE_ID"
          else
            VIDEO_URL="$MANUAL_URL"
            CHAT_ID="$FALLBACK_CHAT_ID"
            STATUS_MESSAGE_ID=""
          fi

          if [ -z "$VIDEO_URL" ]; then
            echo "ERROR: No video URL received"
            exit 1
          fi

          echo "VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"
          echo "CHAT_ID=$CHAT_ID" >> "$GITHUB_ENV"
          echo "STATUS_MESSAGE_ID=$STATUS_MESSAGE_ID" >> "$GITHUB_ENV"

          echo "Request data resolved successfully"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"

          echo "yt-dlp version:"
          yt-dlp --version

      - name: Update status - Downloading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=⬇️ Đang tải video..." \
              > /dev/null || true
          fi

      - name: Download video
        run: |
          mkdir -p downloads

          echo "Starting video download..."

          yt-dlp \
            --no-simulate \
            --no-playlist \
            --newline \
            --merge-output-format mp4 \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

          echo ""
          echo "Downloaded files:"
          ls -lah downloads

      - name: Inspect source video
        run: |
          SOURCE_FILE=$(find downloads -type f -name "*.mp4" | head -n 1)

          if [ -z "$SOURCE_FILE" ]; then
            echo "ERROR: No MP4 file found"
            find downloads -type f -print
            exit 1
          fi

          echo "SOURCE_FILE=$SOURCE_FILE" >> "$GITHUB_ENV"

          echo "Source video:"
          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,pix_fmt,width,height \
            -of default=noprint_wrappers=1 \
            "$SOURCE_FILE"

      - name: Update status - Normalizing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=🎞️ Đang chuẩn hóa video..." \
              > /dev/null || true
          fi

      - name: Normalize video for publishing
        run: |
          mkdir -p processed

          VIDEO_CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$SOURCE_FILE")

          PIX_FMT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=pix_fmt \
            -of default=noprint_wrappers=1:nokey=1 \
            "$SOURCE_FILE")

          AUDIO_CODEC=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$SOURCE_FILE" || true)

          echo "Video codec: $VIDEO_CODEC"
          echo "Pixel format: $PIX_FMT"
          echo "Audio codec: $AUDIO_CODEC"

          if [ "$VIDEO_CODEC" = "h264" ] && \
             [ "$PIX_FMT" = "yuv420p" ] && \
             { [ "$AUDIO_CODEC" = "aac" ] || [ -z "$AUDIO_CODEC" ]; }; then

            echo "Video already compatible. Remuxing only..."

            ffmpeg \
              -y \
              -i "$SOURCE_FILE" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c copy \
              -movflags +faststart \
              processed/ready.mp4

          else

            echo "Converting to H.264 + AAC..."

            ffmpeg \
              -y \
              -i "$SOURCE_FILE" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -movflags +faststart \
              processed/ready.mp4
          fi

      - name: Inspect normalized video
        run: |
          if [ ! -f "processed/ready.mp4" ]; then
            echo "ERROR: Normalized video was not created"
            exit 1
          fi

          echo "Normalized video:"
          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,pix_fmt,width,height \
            -of default=noprint_wrappers=1 \
            processed/ready.mp4

      - name: Update status - Sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=📤 Đã xử lý xong, đang gửi video..." \
              > /dev/null || true
          fi

      - name: Send video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: No Telegram chat ID"
            exit 1
          fi

          echo "Sending normalized video to Telegram..."

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${CHAT_ID}" \
            -F "video=@processed/ready.mp4" \
            -F "supports_streaming=true"

      - name: Update status - Complete
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=✅ Hoàn tất" \
              > /dev/null || true
          fi

      - name: Upload processed video
        uses: actions/upload-artifact@v7
        with:
          name: processed-video
          path: processed/ready.mp4
          if-no-files-found: error
          retention-days: 1

      - name: Update status - Failed
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=❌ Xử lý video thất bại. Kiểm tra GitHub Actions." \
              > /dev/null || true
          fi
