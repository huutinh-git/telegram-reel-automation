name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste TikTok / Facebook / Douyin URL"
        required: true
        type: string

  repository_dispatch:
    types:
      - telegram-video

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      # =========================================
      # 1. Checkout
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================
      # 2. Resolve request data
      # =========================================
      - name: Resolve request data
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_URL: ${{ inputs.video_url }}
          DISPATCH_URL: ${{ github.event.client_payload.video_url }}
          DISPATCH_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DISPATCH_STATUS_MESSAGE_ID: ${{ github.event.client_payload.status_message_id }}
          FALLBACK_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            VIDEO_URL="$DISPATCH_URL"
            CHAT_ID="$DISPATCH_CHAT_ID"
            STATUS_MESSAGE_ID="$DISPATCH_STATUS_MESSAGE_ID"
          else
            VIDEO_URL="$MANUAL_URL"
            CHAT_ID="$FALLBACK_CHAT_ID"
            STATUS_MESSAGE_ID=""
          fi

          if [ -z "$VIDEO_URL" ]; then
            echo "ERROR: No video URL received"
            exit 1
          fi

          echo "VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"
          echo "CHAT_ID=$CHAT_ID" >> "$GITHUB_ENV"
          echo "STATUS_MESSAGE_ID=$STATUS_MESSAGE_ID" >> "$GITHUB_ENV"

          echo "Request data resolved successfully"

      # =========================================
      # 3. Install dependencies
      # =========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"

          echo "yt-dlp version:"
          yt-dlp --version

      # =========================================
      # 4. Telegram status - Downloading
      # =========================================
      - name: Update status - Downloading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=⬇️ Đang tải video..." \
              > /dev/null || true
          fi

      # =========================================
      # 5. Download source video
      # =========================================
      - name: Download video
        run: |
          mkdir -p downloads

          echo "Starting video download..."

          yt-dlp \
            --no-simulate \
            --no-playlist \
            --newline \
            --merge-output-format mp4 \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

          echo ""
          echo "Downloaded files:"
          ls -lah downloads

      # =========================================
      # 6. Inspect source
      # =========================================
      - name: Inspect source video
        run: |
          SOURCE_FILE=$(find downloads -type f -name "*.mp4" | head -n 1)

          if [ -z "$SOURCE_FILE" ]; then
            echo "ERROR: No MP4 file found"
            echo "Files actually created:"
            find downloads -type f -print
            exit 1
          fi

          echo "SOURCE_FILE=$SOURCE_FILE" >> "$GITHUB_ENV"

          echo "Source video:"

          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$SOURCE_FILE"

      # =========================================
      # 7. Telegram status - Normalizing
      # =========================================
      - name: Update status - Normalizing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=🎞️ Đang chuẩn hóa video..." \
              > /dev/null || true
          fi

      # =========================================
      # 8. Normalize H.264 + AAC
      # =========================================
      - name: Normalize video for publishing
        run: |
          mkdir -p processed

          VIDEO_CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$SOURCE_FILE")

          PIX_FMT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=pix_fmt \
            -of default=noprint_wrappers=1:nokey=1 \
            "$SOURCE_FILE")

          AUDIO_CODEC=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$SOURCE_FILE" || true)

          echo "Video codec: $VIDEO_CODEC"
          echo "Pixel format: $PIX_FMT"
          echo "Audio codec: $AUDIO_CODEC"

          if [ "$VIDEO_CODEC" = "h264" ] && \
             [ "$PIX_FMT" = "yuv420p" ] && \
             { [ "$AUDIO_CODEC" = "aac" ] || [ -z "$AUDIO_CODEC" ]; }; then

            echo "Video already compatible. Remuxing only..."

            ffmpeg \
              -y \
              -i "$SOURCE_FILE" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c copy \
              -movflags +faststart \
              processed/ready.mp4

          else

            echo "Converting to H.264 + AAC..."

            ffmpeg \
              -y \
              -i "$SOURCE_FILE" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -movflags +faststart \
              processed/ready.mp4
          fi

      # =========================================
      # 9. Inspect normalized video
      # =========================================
      - name: Inspect normalized video
        run: |
          if [ ! -f "processed/ready.mp4" ]; then
            echo "ERROR: Normalized video was not created"
            exit 1
          fi

          echo "Normalized video:"

          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            processed/ready.mp4

      # =========================================
      # 10. Telegram status - Sending
      # =========================================
      - name: Update status - Sending to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=📤 Đã xử lý xong, đang gửi video..." \
              > /dev/null || true
          fi

      # =========================================
      # 11. Send processed video to Telegram
      # =========================================
      - name: Send video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: No Telegram chat ID"
            exit 1
          fi

          echo "Sending normalized video to Telegram..."

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${CHAT_ID}" \
            -F "video=@processed/ready.mp4" \
            -F "supports_streaming=true"

      # =========================================
      # 12. Telegram status - Facebook
      # =========================================
      - name: Update status - Creating Facebook draft
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=📘 Đang tạo bản nháp Facebook Reel..." \
              > /dev/null || true
          fi

      # =========================================
      # 13. Facebook Reel - CREATE SESSION
      # =========================================
      - name: Create Facebook Reel upload session
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          echo "Creating Facebook Reel upload session..."

          START_RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://graph.facebook.com/v26.0/me/video_reels" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            --data-urlencode "upload_phase=start")

          VIDEO_ID=$(echo "$START_RESPONSE" | python -c \
            "import sys,json; print(json.load(sys.stdin).get('video_id',''))")

          UPLOAD_URL=$(echo "$START_RESPONSE" | python -c \
            "import sys,json; print(json.load(sys.stdin).get('upload_url',''))")

          if [ -z "$VIDEO_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: Facebook did not return video_id or upload_url"
            echo "$START_RESPONSE"
            exit 1
          fi

          echo "FACEBOOK_VIDEO_ID=$VIDEO_ID" >> "$GITHUB_ENV"
          echo "FACEBOOK_UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"

          echo "Facebook upload session created."
          echo "Video ID: $VIDEO_ID"

      # =========================================
      # 14. Facebook Reel - UPLOAD FILE
      # =========================================
      - name: Upload video to Facebook
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          FILE_SIZE=$(stat -c%s processed/ready.mp4)

          echo "Uploading video to Facebook..."
          echo "File size: $FILE_SIZE bytes"

          UPLOAD_RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "$FACEBOOK_UPLOAD_URL" \
            -H "Authorization: OAuth ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            -H "offset: 0" \
            -H "file_size: ${FILE_SIZE}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@processed/ready.mp4")

          echo "$UPLOAD_RESPONSE"

          UPLOAD_SUCCESS=$(echo "$UPLOAD_RESPONSE" | python -c \
            "import sys,json; print(str(json.load(sys.stdin).get('success',False)).lower())")

          if [ "$UPLOAD_SUCCESS" != "true" ]; then
            echo "ERROR: Facebook video upload did not return success=true"
            exit 1
          fi

          echo "Facebook video upload completed."

      # =========================================
      # 15. Facebook Reel - FINISH AS DRAFT
      # =========================================
      - name: Finish Facebook Reel as DRAFT
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          echo "Finishing Facebook Reel as DRAFT..."

          FINISH_RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://graph.facebook.com/v26.0/me/video_reels" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            --data-urlencode "video_id=${FACEBOOK_VIDEO_ID}" \
            --data-urlencode "upload_phase=finish" \
            --data-urlencode "video_state=DRAFT" \
            --data-urlencode "description=Automation test draft")

          echo "$FINISH_RESPONSE"

          FINISH_SUCCESS=$(echo "$FINISH_RESPONSE" | python -c \
            "import sys,json; print(str(json.load(sys.stdin).get('success',False)).lower())")

          if [ "$FINISH_SUCCESS" != "true" ]; then
            echo "ERROR: Facebook did not create the Reel draft successfully"
            exit 1
          fi

          echo "Facebook Reel draft created successfully."

      # =========================================
      # 16. Telegram status - Complete
      # =========================================
      - name: Update status - Complete
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=✅ Hoàn tất — đã tạo Facebook Reel Draft" \
              > /dev/null || true
          fi

      # =========================================
      # 17. Save processed artifact
      # =========================================
      - name: Upload processed video
        uses: actions/upload-artifact@v7
        with:
          name: processed-video
          path: processed/ready.mp4
          if-no-files-found: error
          retention-days: 1

      # =========================================
      # 18. Telegram failure status
      # =========================================
      - name: Update status - Failed
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STATUS_MESSAGE_ID" ] && [ -n "$CHAT_ID" ]; then
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${STATUS_MESSAGE_ID}" \
              --data-urlencode "text=❌ Xử lý thất bại. Kiểm tra GitHub Actions." \
              > /dev/null || true
          fi
